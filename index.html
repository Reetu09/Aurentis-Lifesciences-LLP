  <body>
    <!--
      Hidden blueprint so Netlify Forms can detect "contact" at build time.
      The React page submits to this same form. The notification email is set
      in the Netlify dashboard, not in this file.
    -->
    <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

  </body>
